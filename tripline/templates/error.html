{% extends "base.html" %}

{% block title %}Warning — Tripline{% endblock %}

{% block content %}
<div class="message-screen">
  <div class="message-panel warn">
    <div class="icon-ring">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3 L22 20 H2 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <line x1="12" y1="9.5" x2="12" y2="14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1" fill="currentColor"/>
      </svg>
    </div>
    <h1>This trip couldn't be saved</h1>
    <p>{{ message }}</p>
    <div class="message-actions">
      <a href="javascript:history.back()" class="btn btn-primary">Back to form</a>
      <a href="/" class="btn btn-ghost">Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
